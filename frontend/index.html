<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Test Case Generator</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            height: 170px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }

        select {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #1e293b;
            color: white;
            font-size: 15px;
        }

        .preset-buttons {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .preset-buttons button {
            background: #334155;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        #loading {
            margin-top: 20px;
            color: #facc15;
            display: none;
        }

        #timing {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 14px;
        }

        .output-container {
            margin-top: 30px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #e2e8f0;
            font-size: 15px;
        }

        .history {
            margin-top: 40px;
        }

        .history-item {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .history-item:hover {
            background: #334155;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>AI Test Case Generator</h1>

    <div class="subtitle">
        AI-powered QA testcase generation using Ollama running locally.
    </div>

    <textarea
        id="prompt"
        placeholder="Example: Generate payment gateway validation test cases">
    </textarea>

    <br>

    <select id="model">

        <option value="phi3">
            phi3
        </option>

        <option value="llama3">
            llama3
        </option>

        <option value="mistral">
            mistral
        </option>

    </select>

    <div class="preset-buttons">

        <button onclick="setPrompt('Generate login page test cases')">
            Login
        </button>

        <button onclick="setPrompt('Generate payment gateway test cases')">
            Payments
        </button>

        <button onclick="setPrompt('Generate API validation test cases')">
            API
        </button>

        <button onclick="setPrompt('Generate security testing scenarios')">
            Security
        </button>

        <button onclick="setPrompt('Generate regression test cases for ecommerce checkout')">
            Regression
        </button>

    </div>

    <div class="actions">

        <button onclick="generateTestCases()">
            Generate
        </button>

        <button onclick="copyOutput()">
            Copy
        </button>

        <button onclick="clearOutput()">
            Clear
        </button>

        <button onclick="downloadTxt()">
            Export TXT
        </button>

    </div>

    <div id="loading">
        AI is generating response...
    </div>

    <div id="timing"></div>

    <div class="output-container">

        <div id="output">
Generated test cases will appear here...
        </div>

    </div>

    <div class="history">

        <h3>Prompt History</h3>

        <div id="historyList"></div>

    </div>

</div>

<script>

    const historyKey = 'qa_prompt_history';

    loadHistory();

    function setPrompt(text) {

        document.getElementById('prompt').value =
            text;
    }

    async function generateTestCases() {

        const prompt =
            document.getElementById('prompt').value;

        const model =
            document.getElementById('model').value;

        const output =
            document.getElementById('output');

        const loading =
            document.getElementById('loading');

        const timing =
            document.getElementById('timing');

        output.innerText = '';

        timing.innerText = '';

        loading.style.display = 'block';

        addToHistory(prompt);

        const startTime = performance.now();

        try {

            const response = await fetch(
                'http://localhost:3000/generate',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        prompt: prompt,
                        model: model
                    })
                }
            );

            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();

            while (true) {

                const { done, value } =
                    await reader.read();

                if (done) {

                    break;
                }

                const chunk =
                    decoder.decode(value);

                output.innerText += chunk;

                output.scrollTop =
                    output.scrollHeight;
            }

            const endTime = performance.now();

            const seconds =
                ((endTime - startTime) / 1000)
                .toFixed(2);

            timing.innerText =
                `Generated in ${seconds} seconds`;

        } catch (error) {

            output.innerText =
                'Error generating response';

            console.error(error);

        } finally {

            loading.style.display = 'none';
        }
    }

    function copyOutput() {

        navigator.clipboard.writeText(
            document.getElementById('output').innerText
        );

        alert('Copied to clipboard');
    }

    function clearOutput() {

        document.getElementById('prompt').value = '';

        document.getElementById('output').innerText =
            'Generated test cases will appear here...';

        document.getElementById('timing').innerText = '';
    }

    function downloadTxt() {

        const text =
            document.getElementById('output').innerText;

        const blob =
            new Blob([text], { type: 'text/plain' });

        const a =
            document.createElement('a');

        a.href =
            URL.createObjectURL(blob);

        a.download =
            'testcases.txt';

        a.click();
    }

    function addToHistory(prompt) {

        if (!prompt.trim()) return;

        let history =
            JSON.parse(
                localStorage.getItem(historyKey)
            ) || [];

        history.unshift(prompt);

        history = history.slice(0, 5);

        localStorage.setItem(
            historyKey,
            JSON.stringify(history)
        );

        renderHistory();
    }

    function loadHistory() {

        renderHistory();
    }

    function renderHistory() {

        const historyList =
            document.getElementById('historyList');

        historyList.innerHTML = '';

        const history =
            JSON.parse(
                localStorage.getItem(historyKey)
            ) || [];

        history.forEach(item => {

            const div =
                document.createElement('div');

            div.className =
                'history-item';

            div.innerText = item;

            div.onclick = () => {

                document.getElementById('prompt').value =
                    item;
            };

            historyList.appendChild(div);
        });
    }

</script>

</body>
</html>
